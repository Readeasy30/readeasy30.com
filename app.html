  <p class="eyebrow">
      30-minute reading practice
    </p>

    <h1 id="title">
      Day 1 Reading
    </h1>

    <p class="tagline">
      Read slowly. Think clearly. One step at a time.
    </p>

    <p id="progress">
      Lesson 1 of 5
    </p>

  </div>
</header>

<main class="wrap">

  <section class="panel bubbles-box">

    <h2>🫧 Bubbles Says</h2>

    <p id="coachMessage">
      Take your time. Read the story first. Then answer the questions.
    </p>

  </section>

  <section class="panel">

    <h2>Reading Story</h2>

    <p id="story">
      Loading lesson...
    </p>

  </section>

  <section class="panel">

    <p id="q1"></p>
    <input id="a1" placeholder="Type answer 1" />

    <p id="q2"></p>
    <input id="a2" placeholder="Type answer 2" />

    <p id="q3"></p>
    <input id="a3" placeholder="Type answer 3" />

  </section>

  <button onclick="checkAnswers()">
    Check Answers
  </button>

  <div id="result"
       class="panel"
       style="display:none;">
  </div>

  <div style="display:flex; gap:10px; margin-top:10px;">

    <button onclick="prevDay()">
      ⬅ Prev
    </button>

    <button onclick="nextDay()">
      Next ➡
    </button>

  </div>

  <p style="margin-top:20px;">

    <a href="./index.html">
      ⬅ Back to Home
    </a>

  </p>

</main>

<script>
const lessons = [
  {
    title: "Day 1 Reading",
    story: "Tom went to the park. He saw a dog. The dog was friendly.",
    questions: [
      "Where did Tom go?",
      "What did Tom see?",
      "Was the dog friendly?"
    ]
  },
  {
    title: "Day 2 Reading",
    story: "Maria read a book at school. The book was about a cat.",
    questions: [
      "Where did Maria read?",
      "What did Maria read?",
      "What was the book about?"
    ]
  },
  {
    title: "Day 3 Reading",
    story: "Jake helped his mother carry groceries into the house.",
    questions: [
      "Who helped his mother?",
      "What did Jake carry?",
      "Where did they take the groceries?"
    ]
  },
  {
    title: "Day 4 Reading",
    story: "Sara planted flowers in the garden. She watered them every day.",
    questions: [
      "What did Sara plant?",
      "Where were the flowers planted?",
      "What did Sara do every day?"
    ]
  },
  {
    title: "Day 5 Reading",
    story: "Ben rode his bicycle to the store to buy some milk.",
    questions: [
      "Who rode the bicycle?",
      "Where did Ben go?",
      "What did Ben buy?"
    ]
  }
];

let currentDay = 0;

function loadLesson() {

  const lesson = lessons[currentDay];

  document.getElementById("title").textContent =
    lesson.title;

  document.getElementById("progress").textContent =
    `Lesson ${currentDay + 1} of ${lessons.length}`;

  document.getElementById("story").textContent =
    lesson.story;

  document.getElementById("q1").textContent =
    lesson.questions[0];

  document.getElementById("q2").textContent =
    lesson.questions[1];

  document.getElementById("q3").textContent =
    lesson.questions[2];

  document.getElementById("a1").value = "";
  document.getElementById("a2").value = "";
  document.getElementById("a3").value = "";

  document.getElementById("result").style.display =
    "none";

  document.getElementById("coachMessage").textContent =
    "Take your time. Read the story first. Then answer the questions.";
}

function checkAnswers() {

  const a1 =
    document.getElementById("a1").value.trim();

  const a2 =
    document.getElementById("a2").value.trim();

  const a3 =
    document.getElementById("a3").value.trim();

  const result =
    document.getElementById("result");

  result.style.display = "block";

  if (a1 && a2 && a3) {

    result.textContent =
      "✅ Nice work. You answered all 3 questions.";

    document.getElementById("coachMessage").textContent =
      "Great job. You stayed with the story and answered the questions.";

  } else {

    result.textContent =
      "🫧 Please answer all 3 questions before moving on.";

    document.getElementById("coachMessage").textContent =
      "No rush. Go back to the story and try again.";
  }
}

function nextDay() {

  if (currentDay < lessons.length - 1) {

    currentDay++;

    loadLesson();

  } else {

    document.getElementById("coachMessage").textContent =
      "🎉 You finished all available lessons. Great work.";
  }
}

function prevDay() {

  if (currentDay > 0) {

    currentDay--;

    loadLesson();
  }
}

loadLesson();
</script>

</body>
</html>
