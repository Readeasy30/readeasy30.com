function nextDay() {
  if (currentDay < lessons.length - 1) {
    currentDay++;
    loadLesson();
  } else {
    document.getElementById("coachMessage").textContent =
      "You finished the available lessons. Great work.";
  }
}

function prevDay() {
  if (currentDay > 0) {
    currentDay--;
    loadLesson();
  }
}

loadLesson();
</script>
