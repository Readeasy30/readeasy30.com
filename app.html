<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReadEasy30</title>

  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <div class="container">

    <h1 id="title">ReadEasy30</h1>

    <p id="progress"></p>

    <div class="story-box">
      <p id="story"></p>
    </div>

    <div class="questions">

      <p id="q1"></p>
      <input type="text" id="a1" placeholder="Type answer here" />

      <p id="q2"></p>
      <input type="text" id="a2" placeholder="Type answer here" />

      <p id="q3"></p>
      <input type="text" id="a3" placeholder="Type answer here" />

    </div>

    <div class="buttons">
      <button onclick="checkAnswers()">Check Answers</button>
      <button onclick="prevDay()">Previous Day</button>
      <button onclick="nextDay()">Next Day</button>
      <button onclick="resetProgress()">Reset</button>
    </div>

    <div id="result"></div>

    <div class="coach">
      <p id="coachMessage"></p>
    </div>

  </div>

  <script src="app.js"></script>

</body>
</html>
