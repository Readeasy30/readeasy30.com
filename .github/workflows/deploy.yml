name: AI-Reviewed Cloudflare Deployment Pipeline

on:
  push:
    branches:
      - main

jobs:
  review-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Gemini AI Static App Guard
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "Starting automated Gemini AI code quality audit..."
          
          TARGET_FILE="app.js"
          if [ ! -f "$TARGET_FILE" ]; then
            echo "⚠️ Target file $TARGET_FILE not found. Skipping granular file check."
            exit 0
          fi

          FILE_CONTENT=$(cat "$TARGET_FILE" | jq -sR .)

          JSON_PAYLOAD=$(cat <<EOF
          {
            "contents": [{
              "parts": [{
                "text": "Act as a strict automated static asset reviewer. Review the following code for syntax blockers, unescaped string patterns, or structural breaks. If the file is clean and deployable, respond with exactly the single word: PASSED. If there are flaws, respond with a direct error summary. Content: $FILE_CONTENT"
              }]
            }]
          }
          EOF
          )

          # VERIFIED ENDPOINT HOST: Corrected network path resolution
          RESPONSE=$(curl -s -X POST \
            -H "Content-Type: application/json" \
            "https://googleapis.com{GEMINI_API_KEY}" \
            -d "$JSON_PAYLOAD")

          AI_RESULT=$(echo "$RESPONSE" | jq -r '.candidates.content.parts.text' | xargs)

          echo "======================================"
          echo "Gemini AI Review Result: $AI_RESULT"
          echo "======================================"

          if [[ "$AI_RESULT" != *"PASSED"* ]]; then
            echo "❌ CI/CD Gate Failed: Gemini AI found production blockers."
            echo "$AI_RESULT"
            exit 1
          fi

          echo "✅ Gemini AI Gate Passed. Proceeding to Cloudflare Deployment."

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=readeasy30
