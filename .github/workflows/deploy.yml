name: Deploy ReadEasy30

on:
# Add this property explicitly inside your deployment action workflow files
permissions:
  contents: write
  deployments: write
  statuses: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Ensure your checkout stage explicitly implements permissions using your Token reference
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # Or your custom personal access token variable mapping


  push:
    branches:
      - main

jobs:
  guard:
    name: Production Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run production guard
        run: bash scripts/production-guard.sh

  deploy:
    name: Deploy to Cloudflare Pages
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: readeasy30.com
          directory: .
