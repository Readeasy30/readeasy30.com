name: Daily Marketing Check
on:
  schedule:
    - cron: '0 13 * * *'  # 8am CT daily
  workflow_dispatch:

jobs:
  marketing-check:
    runs-on: ubuntu-latest
    steps:
      - name: Get today's marketing task
        run: |
          RESPONSE=$(curl -s --max-time 10 https://marketing-auto.workers.dev/today || echo '{"status":"unavailable"}')
          echo "Today's marketing task:"
          echo "$RESPONSE"

      - name: Ping marketing scheduler
        run: |
          echo "Marketing check complete for $(date)"
