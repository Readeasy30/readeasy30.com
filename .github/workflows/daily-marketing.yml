name: Daily Marketing Task

on:
  schedule:
    - cron: '0 13 * * *'   # 8am CT / 1pm UTC daily
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  daily-task:
    runs-on: ubuntu-latest
    steps:
      - name: Generate today's distribution tasks
        run: |
          set -eo pipefail

          DAY_OF_YEAR=$(date +%j)
          DAY_OF_WEEK=$(date +%u)   # 1=Mon ... 7=Sun
          DAY_OF_MONTH=$(date +%-d)
          DATE=$(date +%Y-%m-%d)

          echo "## 📋 ReadEasy30 Distribution Tasks — $DATE" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # --- Daily: rotate Facebook Page post type ---
          FB_TASKS=(
            "Post a lesson highlight (pick today's featured story from level-a through level-h lessons)."
            "Post a printable worksheet spotlight with direct link."
            "Post a parent/tutor tip from parent-tutor-guide.html."
          )
          FB_INDEX=$(( (10#$DAY_OF_YEAR) % ${#FB_TASKS[@]} ))
          echo "- **Facebook Page:** ${FB_TASKS[$FB_INDEX]}" >> "$GITHUB_STEP_SUMMARY"

          # --- 2x/week: Pinterest pin (Mon & Thu) ---
          if [ "$DAY_OF_WEEK" = "1" ] || [ "$DAY_OF_WEEK" = "4" ]; then
            echo "- **Pinterest:** Create a pin for one existing worksheet page not yet pinned (e.g. vocabulary-in-context-worksheet.html)." >> "$GITHUB_STEP_SUMMARY"
          fi

          # --- Weekly: new community (Monday only) ---
          if [ "$DAY_OF_WEEK" = "1" ]; then
            COMMUNITIES=(
              "A homeschool Facebook group not posted in yet"
              "r/homeschool on Reddit"
              "r/ESL_Teachers on Reddit"
              "r/elementary_education on Reddit"
              "An ESL parents Facebook group"
            )
            WEEK_NUM=$(( ( (10#$DAY_OF_YEAR) / 7 ) % ${#COMMUNITIES[@]} ))
            echo "- **New community this week:** Share readeasy30.com in ${COMMUNITIES[$WEEK_NUM]}." >> "$GITHUB_STEP_SUMMARY"
          fi

          # --- Monthly: blogger/roundup outreach (first 3 days of month) ---
          if [ "$DAY_OF_MONTH" -le 3 ]; then
            echo "- **Monthly outreach:** Reach out to 2-3 homeschool bloggers or free-resource roundup sites for inclusion." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "_See distribution-plan.md in control-room for ready-to-post copy templates._" >> "$GITHUB_STEP_SUMMARY"
