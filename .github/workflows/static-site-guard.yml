name: Static Site Guard

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Core Validation Guardrails
        run: |
          set -euo pipefail
          echo "Checking ReadEasy30 static site guardrails..."

          # 1. Verify necessary files exist
          # FIXED: style.css lives in css/ directory, not at root.
          # FIXED: student-profiles.js is not in the repo — removed.
          required_files=("index.html" "app.html" "app.js")
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: $file is missing from workspace root."
              exit 1
            fi
          done

          # 1b. Verify CSS exists somewhere (root or css/ directory)
          if [ -f "style.css" ]; then
            echo "✅ style.css found at root"
          elif [ -d "css" ] && [ -n "$(ls css/*.css 2>/dev/null)" ]; then
            echo "✅ CSS files found in css/ directory"
          else
            echo "ERROR: No CSS found — neither style.css at root nor css/*.css"
            exit 1
          fi

          # 2. Extract HTML text completely stripped of spaces/newlines
          CLEANED_HTML=$(tr -

