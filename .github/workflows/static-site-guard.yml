name: Static Site Guard

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Core Validation Guardrails
        run: |
          set -euo pipefail
          echo "Checking ReadEasy30 static site guardrails..."
          
          # 1. Verify necessary files exist
          required_files=("index.html" "app.html" "app.js" "style.css")
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: $file is missing from workspace root."
              exit 1
            fi
          done

          # 2. Extract HTML text completely stripped of spaces/newlines
          CLEANED_HTML=$(tr -d '[:space:]' < app.html)

          # 3. Flexible structural validation check
          if [[ "$CLEANED_HTML" != *"student-profiles.js"* ]]; then
            echo "ERROR: app.html must load student-profiles.js"
            exit 1
          fi

          if [[ "$CLEANED_HTML" != *"app.js"* ]]; then
            echo "ERROR: app.html must load app.js"
            exit 1
          fi

          echo "Static site guard passed successfully."
