name: Static Site Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Block known ReadEasy30 static-site regressions
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking ReadEasy30 static site guardrails..."

          required_files=(
            "index.html"
            "app.html"
            "app.js"
            "css/style.css"
            "sitemap.xml"
            "robots.txt"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: $file is missing."
              exit 1
            fi
          done

          echo "Checking public HTML/CSS/JS files for framework regressions..."

          # Only scan public website code. Documentation files intentionally mention
          # React/Vite in warnings such as "do not use React/Vite" and must not fail CI.
          mapfile -t public_files < <(find . \
            -path "./.git" -prune -o \
            -path "./.github" -prune -o \
            -type f \( -name "*.html" -o -name "*.css" -o -name "*.js" \) \
            -print)

          if printf '%s\n' "${public_files[@]}" | xargs grep -IlE "(from ['\"]react|import React|createRoot|ReactDOM|vite/client|@vite|vite\.config)" | grep -q .; then
            echo "ERROR: React/Vite runtime references found in public site files."
            exit 1
          fi

          if grep -n "<script" app.html | grep -E "level-[b-h]-lessons|read-live-240-integration|grade-path-lessons|audio-fix|session-timer|report|vocab-helper|learner-mode|session-plan|startup-fix|bubbles-question-buttons"; then
            echo "ERROR: Old ReadEasy30 app script stack is loaded by app.html."
            exit 1
          fi

          if ! grep -q "student-profiles.js" app.html; then
            echo "ERROR: app.html must load student-profiles.js."
            exit 1
          fi

          if ! grep -q "app.js" app.html; then
            echo "ERROR: app.html must load app.js."
            exit 1
          fi

          echo "Static site guard passed."
