yamlname: Auto-Post Facebook

on:
  schedule:
    - cron: '0 14 * * *'   # 9am CT daily
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Post to ReadEasy30 Facebook Page
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          set -eo pipefail
          DAY=$(( 10#$(date +%j) ))

          MSGS=(
            "Free reading practice for kids — 240 daily lessons across 8 levels, no signup, no ads. Just open and read. 📖"
            "Homeschooling? Our free printable reading worksheets are ready to go — print and teach today. ✏️"
            "ESL families: short daily reading passages built for learners. 100% free, works on any device. 🌍"
            "Parents & tutors: our free guide shows exactly how to run a 30-minute reading session that works. 👨‍👩‍👧"
            "Struggling reader? Start at level A and build up — one short story a day. Free forever. 📚"
            "Teachers: free leveled reading passages (A–H) you can use in class tomorrow. No login required. 🍎"
          )
          LINKS=(
            "https://readeasy30.com/app"
            "https://readeasy30.com/worksheets.html"
            "https://readeasy30.com"
            "https://readeasy30.com/parent-tutor-guide.html"
            "https://readeasy30.com/app"
            "https://readeasy30.com"
          )
          I=$(( DAY % ${#MSGS[@]} ))

          RESPONSE=$(curl -s -X POST "https://graph.facebook.com/v21.0/${FB_PAGE_ID}/feed" \
            --data-urlencode "message=${MSGS[$I]}" \
            --data-urlencode "link=${LINKS[$I]}" \
            --data-urlencode "access_token=${FB_PAGE_TOKEN}")

          echo "$RESPONSE" | grep -q '"id"' || { echo "POST FAILED: $RESPONSE"; exit 1; }
          echo "## ✅ Posted to Facebook — $(date +%Y-%m-%d)" >> "$GITHUB_STEP_SUMMARY"
          echo "${MSGS[$I]}" >> "$GITHUB_STEP_SUMMARY"
