  <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ReadEasy30</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f6f9fc;
  color: #222;
}

header {
  background: #2d6cdf;
  color: white;
  padding: 20px;
  text-align: center;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  padding: 20px;
  margin: 15px 0;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

button {
  padding: 12px 16px;
  margin: 8px 5px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 16px;
}

.primary {
  background: #2d6cdf;
  color: white;
}

.secondary {
  background: #e6eefc;
}

.hidden {
  display: none;
}

select {
  padding: 10px;
  width: 100%;
  margin-top: 8px;
  margin-bottom: 12px;
  border-radius: 6px;
  border: 1px solid #ccc;
}

.lesson-box {
  background: #f0f6ff;
  padding: 15px;
  border-radius: 10px;
}
</style>
</head>

<body>

<header>
  <h1>📘 ReadEasy30</h1>
  <p>30 Minutes to Reading Success</p>
</header>

<div class="container">

  <!-- MODE -->
  <div class="card">
    <h2>Choose Mode</h2>
    <button class="primary" onclick="showStudent()">🧑‍🎓 Student</button>
    <button class="secondary" onclick="showTeacher()">🧑‍🏫 Teacher (Bubbles AI)</button>
  </div>

  <!-- STUDENT -->
  <div id="studentMode" class="card">
    <h2>🧑‍🎓 Student Lesson</h2>

    <p><b>Day 1:</b> Tom went to the park. He saw a dog. The dog was friendly.</p>

    <h3>Questions</h3>
    <ol>
      <li>Where did Tom go?</li>
      <li>What did he see?</li>
      <li>Was the dog friendly?</li>
    </ol>

    <button class="primary">Mark Complete</button>
  </div>

  <!-- TEACHER -->
  <div id="teacherMode" class="card hidden">
    <h2>🫧 Bubbles AI Teacher Mode</h2>

    <label>Grade Level</label>
    <select id="grade">
      <option>K–1</option>
      <option>2–3</option>
      <option>4–6</option>
    </select>

    <label>Skill</label>
    <select id="skill">
      <option>Main Idea</option>
      <option>Vocabulary</option>
      <option>Reading Comprehension</option>
    </select>

    <label>Time</label>
    <select id="time">
      <option>10</option>
      <option>20</option>
      <option>30</option>
    </select>

    <button class="primary" onclick="generateLesson()">Generate Lesson</button>

    <div id="lessonOutput" class="lesson-box hidden"></div>
  </div>

</div>

<script>
function showStudent() {
  document.getElementById("studentMode").style.display = "block";
  document.getElementById("teacherMode").style.display = "none";
}

function showTeacher() {
  document.getElementById("studentMode").style.display = "none";
  document.getElementById("teacherMode").style.display = "block";
}

async function generateLesson() {
  const grade = document.getElementById("grade").value;
  const skill = document.getElementById("skill").value;
  const time = document.getElementById("time").value;

  const output = document.getElementById("lessonOutput");
  output.classList.remove("hidden");
  output.innerHTML = "🫧 Generating lesson...";

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        messages: [
          {
            role: "user",
            content: `
Create a reading lesson.

Grade: ${grade}
Skill: ${skill}
Time: ${time}

Return ONLY JSON:
{
  "story": "",
  "questions": [],
  "vocabulary": {
    "word": "",
    "definition": ""
  },
  "challenge_question": ""
}
            `
          }
        ]
      })
    });

    const data = await res.json();

    const raw =
      data?.response ||
      data?.result?.response ||
      data?.output ||
      JSON.stringify(data);

    let lesson;

    try {
      lesson = JSON.parse(raw);
    } catch {
      lesson = {
        story: raw,
        questions: [],
        vocabulary: { word: "", definition: "" },
        challenge_question: ""
      };
    }

    output.innerHTML = `
      <h3>📖 Bubbles AI Lesson</h3>

      <p><b>Story:</b> ${lesson.story}</p>

      <h4>Questions</h4>
      <ol>
        ${(lesson.questions || []).map(q => `<li>${q}</li>`).join("")}
      </ol>

      <p><b>Vocabulary:</b> ${lesson.vocabulary?.word || ""} - ${lesson.vocabulary?.definition || ""}</p>

      <p><b>Challenge:</b> ${lesson.challenge_question || ""}</p>
    `;

  } catch (err) {
    output.innerHTML = "❌ Error connecting to AI.";
    console.error(err);
  }
}
</script>

</body>
</html>
