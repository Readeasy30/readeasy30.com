<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ReadEasy30</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f6f9fc;
  color: #222;
}

header {
  background: #2d6cdf;
  color: white;
  padding: 20px;
  text-align: center;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  padding: 20px;
  margin: 15px 0;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

button {
  padding: 12px 16px;
  margin: 8px 5px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 16px;
}

.primary {
  background: #2d6cdf;
  color: white;
}

.secondary {
  background: #e6eefc;
}

.hidden {
  display: none;
}

input, select {
  padding: 10px;
  width: 100%;
  margin-top: 8px;
  margin-bottom: 12px;
  border-radius: 6px;
  border: 1px solid #ccc;
}

h2 {
  margin-top: 0;
}

.lesson-box {
  background: #f0f6ff;
  padding: 15px;
  border-radius: 10px;
}
</style>
</head>

<body>

<header>
  <h1>📘 ReadEasy30</h1>
  <p>30 Minutes to Reading Success</p>
</header>

<div class="container">

  <!-- MODE SELECT -->
  <div class="card">
    <h2>Choose Mode</h2>
    <button class="primary" onclick="showStudent()">🧑‍🎓 Student Mode</button>
    <button class="secondary" onclick="showTeacher()">🧑‍🏫 Teacher Mode (Bubbles AI)</button>
  </div>

  <!-- STUDENT MODE -->
  <div id="studentMode" class="card">
    <h2>🧑‍🎓 Student Lesson</h2>

    <p><b>Day 1:</b> Tom went to the park. He saw a dog. The dog was friendly.</p>

    <h3>Questions</h3>
    <ol>
      <li>Where did Tom go?</li>
      <li>What did he see?</li>
      <li>Was it a good day?</li>
    </ol>

    <button class="primary">Mark Complete</button>
  </div>

  <!-- TEACHER MODE -->
  <div id="teacherMode" class="card hidden">
    <h2>🫧 Bubbles AI Teacher Mode</h2>

    <label>Grade Level</label>
    <select id="grade">
      <option>K–1</option>
      <option>2–3</option>
      <option>4–6</option>
    </select>

    <label>Skill Focus</label>
    <select id="skill">
      <option>Main Idea</option>
      <option>Vocabulary</option>
      <option>Reading Comprehension</option>
    </select>

    <label>Time (minutes)</label>
    <select id="time">
      <option>10</option>
      <option>20</option>
      <option>30</option>
    </select>

    <button class="primary" onclick="generateLesson()">Generate Lesson</button>

    <div id="lessonOutput" class="lesson-box hidden"></div>
  </div>

</div>

<script>
function showStudent() {
  document.getElementById("studentMode").style.display = "block";
  document.getElementById("teacherMode").style.display = "none";
}

function showTeacher() {
  document.getElementById("studentMode").style.display = "none";
  document.getElementById("teacherMode").style.display = "block";
}

async function generateLesson() {
  const grade = document.getElementById("grade").value;
  const skill = document.getElementById("skill").value;
  const time = document.getElementById("time").value;

  const output = document.getElementById("lessonOutput");
  output.classList.remove("hidden");
  output.innerHTML = "🫧 Generating lesson...";

  // Placeholder (we connect Cloudflare Worker next step)
  setTimeout(() => {
    output.innerHTML = `
      <h3>📖 Sample Lesson (Bubbles AI)</h3>
      <p><b>Story:</b> Mia went to the garden and saw butterflies dancing in the sun.</p>

      <h4>Questions</h4>
      <ol>
        <li>Where did Mia go?</li>
        <li>What did she see?</li>
        <li>How did the butterflies move?</li>
      </ol>

      <p><b>Vocabulary:</b> Garden - a place where plants and flowers grow.</p>

      <p><i>Want easier or harder version?</i></p>
    `;
  }, 1200);
}
</script>

</body>
</html>
