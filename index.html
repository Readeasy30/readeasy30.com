<!DOCTYPE html>
<html>
<head>
  <title>ReadEasy30</title>
</head>
<h1 style="color:red;">VERSION 2 TEST</h1>
<body>

<div id="app"></div>

<script>
const TOTAL_DAYS = 30;

// Load progress
let progress = JSON.parse(localStorage.getItem("readeasy_progress")) || {
  currentDay: 1,
  completed: {}
};

// Sample lesson structure
const lessons = Array.from({ length: TOTAL_DAYS }, (_, i) => ({
  day: i + 1,
  story: `Day ${i + 1}: Tom went to the park. He saw something interesting.`,
  questions: [
    "Where did Tom go?",
    "What did he see?",
    "Was it a good day?"
  ]
}));

function saveProgress() {
  localStorage.setItem("readeasy_progress", JSON.stringify(progress));
}

// START SCREEN
function renderStart() {
  document.getElementById("app").innerHTML = `
    <div style="padding:20px;font-family:sans-serif;text-align:center;">
      <h1>ReadEasy30</h1>
      <p>Learn to read in 30 days</p>
      <button onclick="startLesson()" style="padding:10px 20px;font-size:18px;">
        Start Reading
      </button>
    </div>
  `;
}

// LESSON SCREEN
function renderLesson(day) {
  const lesson = lessons[day - 1];

  document.getElementById("app").innerHTML = `
    <div style="padding:20px;font-family:sans-serif;">
      <h2>Day ${lesson.day}</h2>

      <p>${lesson.story}</p>

      <h3>Questions</h3>
      <ol>
        ${lesson.questions.map(q => `<li>${q}</li>`).join("")}
      </ol>

      <button onclick="completeLesson()" style="padding:10px 15px;">
        Mark Complete
      </button>

      <button onclick="goBack()" style="margin-left:10px;">
        Back
      </button>
    </div>
  `;
}

  // ACTIONS
function startLesson() {
  renderLesson(progress.currentDay);
}

function completeLesson() {
  progress.completed[progress.currentDay] = true;

  if (progress.currentDay < TOTAL_DAYS) {
    progress.currentDay++;
  }

  saveProgress();
  renderLesson(progress.currentDay);
}

function goBack() {
  renderStart();
}

// INIT
renderStart();
</script>

</body>
</html>
