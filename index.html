html<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>readeasy30 - Home</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="background-color: #fdfdfd; font-family: sans-serif; text-align: center; color: #333;">

    <header style="padding: 50px;">
        <h1>readeasy30</h1>
        <p>25 Minutes to Reading Success</p>
    </header>

    <main>
        <!-- Bubbles will live here -->
        <div id="bubbles-container" style="margin: 20px;">
            <div style="font-size: 50px;">🫧</div>
            <p><strong>Hi! I'm Bubbles.</strong></p>
        </div>

        <button style="padding: 20px 40px; font-size: 24px; background-color: #ffd700; border: none; border-radius: 10px; cursor: pointer;">
            Start Today's Lesson
        </button> 

        
    </main>
<section id="heroes-board" style="margin-top: 50px; padding: 20px;">
    <h3>Your 30-Day Hero Journey</h3>
    <div id="grid-container" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(60px, 1fr)); gap: 15px; max-width: 600px; margin: 0 auto;">
        <!-- We will use a small script to make 30 circles -->
        <script>
            for (let i = 1; i <= 30; i++) {
                document.write(`<div class="day-circle">${i}</div>`);
            }
        </script>
    </div>
</section>
</body>
</html>
