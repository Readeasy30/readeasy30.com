<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReadEasy30</title>

<style>
body {
  font-family: Arial;
  background: #f7f9fc;
  text-align: center;
  padding: 20px;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 15px;
  max-width: 700px;
  margin: 20px auto;
  box-shadow: 0 4px 10px rgba(0,0,0,0.08);
}

.button {
  display: inline-block;
  padding: 10px 15px;
  background: #4A90E2;
  color: white;
  border-radius: 10px;
  text-decoration: none;
  font-weight: bold;
  cursor: pointer;
}

.grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 8px;
  max-width: 420px;
  margin: auto;
}

.day {
  padding: 8px;
  border: 1px solid #ccc;
  border-radius: 8px;
  cursor: pointer;
  background: white;
}

.day:hover {
  background: #eaf3ff;
}

.story {
  font-size: 18px;
  line-height: 1.6;
}
</style>
</head>

<body>

<h1>📘 ReadEasy30</h1>
<p>25 Minutes to Reading Success</p>

<div class="card">
  <h2>🫧 Meet Bubbles</h2>
  <p>Your reading coach is ready.</p>

  <a class="button" href="https://bubbles-ai-guide.wholelychit.workers.dev" target="_blank">
    💬 Ask Bubbles
  </a>
</div>

<div class="card">
  <h2>⭐ Day <span id="dayNum">1</span></h2>

  <p class="story" id="story"></p>

  <div class="card">
    <p id="q1"></p>
    <p id="q2"></p>
    <p id="q3"></p>
  </div>

  <button class="button" onclick="prevDay()">⬅ Prev</button>
  <button class="button" onclick="nextDay()">Next ➡</button>
</div>

<div class="card">
  <h2>📅 Pick a Day</h2>
  <div class="grid" id="grid"></div>
</div>

<script>
const lessons = [
  {story:"Tom went to the park. He saw a dog. The dog was friendly.", q1:"Where did Tom go?", q2:"What did he see?", q3:"Was the dog friendly?"},
  {story:"Sara read a book at school. She learned new words.", q1:"Where did Sara read?", q2:"What did she learn?", q3:"Did she enjoy it?"},
  {story:"Mike played soccer with friends.", q1:"What did Mike play?", q2:"Who did he play with?", q3:"Was he alone?"}
];

while (lessons.length < 30) {
  lessons.push({
    story:"This is Day " + (lessons.length+1) + ". Keep practicing reading.",
    q1:"What day is it?",
    q2:"What are you doing?",
    q3:"Are you improving?"
  });
}

let currentDay = 0;

function loadDay(i){
  currentDay = i;

  document.getElementById("dayNum").innerText = i + 1;
  document.getElementById("story").innerText = lessons[i].story;
  document.getElementById("q1").innerText = "1. " + lessons[i].q1;
  document.getElementById("q2").innerText = "2. " + lessons[i].q2;
  document.getElementById("q3").innerText = "3. " + lessons[i].q3;
}

function nextDay(){
  if(currentDay < 29) loadDay(currentDay + 1);
}

function prevDay(){
  if(currentDay > 0) loadDay(currentDay - 1);
}

let grid = document.getElementById("grid");
for(let i=0;i<30;i++){
  let d = document.createElement("div");
  d.className = "day";
  d.innerText = i+1;
  d.onclick = () => loadDay(i);
  grid.appendChild(d);
}

loadDay(0);
</script>

</body>
</html>
