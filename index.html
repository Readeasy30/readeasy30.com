  <!-- STUDENT MODE -->
  <div id="studentMode" class="card">
    <h2>🧑‍🎓 Student Lesson</h2>

    <p><b>Day 1:</b> Tom went to the park. He saw a dog. The dog was friendly.</p>

    <h3>Questions</h3>
    <ol>
      <li>Where did Tom go?</li>
      <li>What did he see?</li>
      <li>Was it a good day?</li>
    </ol>

    <button class="primary">Mark Complete</button>
  </div>

  <!-- TEACHER MODE -->
  <div id="teacherMode" class="card hidden">
    <h2>🫧 Bubbles AI Teacher Mode</h2>

    <label>Grade Level</label>
    <select id="grade">
      <option>K–1</option>
      <option>2–3</option>
      <option>4–6</option>
    </select>

    <label>Skill Focus</label>
    <select id="skill">
      <option>Main Idea</option>
      <option>Vocabulary</option>
      <option>Reading Comprehension</option>
    </select>

    <label>Time (minutes)</label>
    <select id="time">
      <option>10</option>
      <option>20</option>
      <option>30</option>
    </select>

    <button class="primary" onclick="generateLesson()">Generate Lesson</button>

    <div id="lessonOutput" class="lesson-box hidden"></div>
  </div>

</div>

<script>
function showStudent() {
  document.getElementById("studentMode").style.display = "block";
  document.getElementById("teacherMode").style.display = "none";
}

function showTeacher() {
  document.getElementById("studentMode").style.display = "none";
  document.getElementById("teacherMode").style.display = "block";
}

async function generateLesson() {
  const grade = document.getElementById("grade").value;
  const skill = document.getElementById("skill").value;
  const time = document.getElementById("time").value;

  const output = document.getElementById("lessonOutput");
  output.classList.remove("hidden");
  output.innerHTML = "🫧 Generating lesson...";

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        messages: [
          {
            role: "user",
            content: `
Create a reading lesson for a child.

Grade level: ${grade}
Skill: ${skill}
Time: ${time}

Return ONLY JSON:
{
  "story": "",
  "questions": [],
  "vocabulary": {
    "word": "",
    "definition": ""
  },
  "challenge_question": ""
}
            `
          }
        ]
      })
    });

    const data = await res.json();

    const raw =
      data.response ||
      data.output ||
      data.result ||
      JSON.stringify(data);

    let lesson;

    try {
      lesson = typeof raw === "string" ? JSON.parse(raw) : raw;
    } catch {
      lesson = {
        story: raw,
        questions: [],
        vocabulary: { word: "", definition: "" },
        challenge_question: ""
      };
    }

    output.innerHTML = `
      <h3>📖 Bubbles AI Lesson</h3>

      <p><b>Story:</b> ${lesson.story}</p>

      <h4>Questions</h4>
      <ol>
        ${(lesson.questions || []).map(q => `<li>${q}</li>`).join("")}
      </ol>

      <p><b>Vocabulary:</b> ${lesson.vocabulary?.word || ""} - ${lesson.vocabulary?.definition || ""}</p>

      <p><b>Challenge:</b> ${lesson.challenge_question || ""}</p>
    `;

  } catch (err) {
    output.innerHTML = "❌ Error connecting to AI backend.";
    console.error(err);
  }
}
</script>

</body>
</html>
.
