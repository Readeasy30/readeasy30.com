<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>ReadEasy30 - Free Reading Practice</title><script src='https://cdn.tailwindcss.com'></script></head><body class='bg-gray-50 text-gray-900 min-h-screen flex flex-col justify-between'><header class='bg-white border-b border-gray-200 py-4 px-6 shadow-sm'><div class='max-w-4xl mx-auto flex justify-between items-center'><h1 class='text-2xl font-black text-blue-600'>ReadEasy30</h1><p class='text-sm font-semibold text-gray-600'>30 Minutes a Day. Zero Cost.</p></div></header><main class='flex-grow p-4'><section class='max-w-4xl mx-auto p-6 bg-white rounded-2xl shadow-lg border border-gray-100 my-8'><div class='flex flex-col md:flex-row items-center justify-between gap-6'><div class='flex items-center space-x-4'><div class='w-16 h-16 bg-blue-600 rounded-full flex items-center justify-center text-white text-2xl font-bold shadow-md'>📖</div><div><h3 class='text-xl font-bold text-gray-900'>ReadEasy30 Coach</h3><p class='text-lg font-semibold text-blue-600 my-1' id='current-word'>Click 'Next Word' to begin</p><p class='text-xs text-gray-500' id='coach-status'>Take your time. 30 minutes a day builds fluent readers.</p></div></div><div class='w-full md:w-1/3 bg-gray-50 p-4 rounded-xl border border-gray-200'><div class='flex justify-between text-sm font-semibold text-gray-700 mb-2'><span>Daily Goal</span><span id='timer-display'>30:00 remaining</span></div><div class='w-full bg-gray-200 rounded-full h-3'><div id='progress-bar' class='bg-blue-600 h-3 rounded-full transition-all duration-500' style='width: 100%;'></div></div></div></div><div class='mt-6 flex flex-wrap gap-3 items-center justify-between border-t border-gray-100 pt-4'><div class='flex gap-2 flex-wrap'><button onclick='readCurrentWord()' class='px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl shadow transition flex items-center gap-2'>🔊 Hear Word</button><button onclick='toggleSlowPacing()' id='pacing-btn' class='px-4 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-800 font-semibold rounded-xl transition'>🐢 Slow Speech: Off</button></div><div class='flex gap-2'><button onclick='previousWord()' class='px-4 py-2.5 bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold rounded-xl transition'>&larr; Back</button><button onclick='nextWord()' class='px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl shadow transition'>Next Word &rarr;</button></div></div></section></main><footer class='bg-white border-t border-gray-200 py-4 text-center text-sm text-gray-500'><p>&copy; 2026 ReadEasy30. Empowering readers everywhere at zero cost.</p></footer><script>const practiceList=[{word:'the',tip:'A fundamental building block word.'},{word:'and',tip:'Connects ideas together smoothly.'},{word:'look',tip:'Use your eyes to focus.'},{word:'because',tip:'Break it down: be-cause.'},{word:'through',tip:'Notice the ough sound pattern.'},{word:'comprehension',tip:'Understanding what you read step by step.'}];let currentIndex=0;let isSlowPaced=false;function updateDisplay(){const currentObj=practiceList[currentIndex];document.getElementById('current-word').innerText=currentObj.word;document.getElementById('coach-status').innerText=currentObj.tip;}function readCurrentWord(){const wordText=practiceList[currentIndex].word;if('speechSynthesis' in window){window.speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(wordText);utterance.rate=isSlowPaced?0.6:0.9;window.speechSynthesis.speak(utterance);}else{alert('Text-to-speech is not supported.');}}function toggleSlowPacing(){isSlowPaced=!isSlowPaced;const btn=document.getElementById('pacing-btn');btn.innerText=isSlowPaced?'🐢 Slow Speech: On':'🐢 Slow Speech: Off';btn.classList.toggle('bg-emerald-100',isSlowPaced);}function nextWord(){currentIndex=(currentIndex+1)%practiceList.length;updateDisplay();readCurrentWord();}function previousWord(){currentIndex=(currentIndex-1+practiceList.length)%practiceList.length;updateDisplay();readCurrentWord();}updateDisplay();</script></body></html>
